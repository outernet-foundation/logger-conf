[project]
name = "logconf"
version = "0.1.0"
description = "Opinionated stdlib logging configuration: human stderr + JSON file + optional OTLP"
requires-python = ">=3.13"
dependencies = [
  "python-json-logger>=3.2.0",
]

[project.optional-dependencies]
otlp = [
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "logconf[otlp]", "pytest>=8.0.0", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logconf"]
include = ["src/logconf/py.typed"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
